name: Release

# Push a tag like v0.1.0 to publish that version to npm and make a GitHub release.
# The tag must match the version in packages/cli/package.json.
#
# Needs one repository secret: NPM_TOKEN, an npm "Automation" or granular
# access token that may publish soreqen-code.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm provenance: proves the package was built from this repository

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches the version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli version $version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:npm

      - name: Check the package installs and starts
        working-directory: npm
        run: |
          npm pack
          npm install -g ./soreqen-code-*.tgz
          soreqen --version

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release notes from the changelog
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "SoreQen Code $GITHUB_REF_NAME" > notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" npm/soreqen-code-*.tgz --title "SoreQen Code $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
